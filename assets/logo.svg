<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="pearGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Subtle glow backdrop -->
  <circle cx="256" cy="270" r="180" fill="url(#pearGlow)" />

  <g transform="translate(0, 10)">
    <!-- Stem & Leaf -->
    <path fill="#ffffff" opacity="0.9" d="M256,70 C256,70 270,110 252,145 C250,149 256,150 258,146 C275,115 264,72 264,72 Z"/>
    <path fill="#ffffff" opacity="0.95" d="M258,115 C285,95 325,100 330,125 C310,135 275,130 258,115 Z"/>

    <!-- Minimalist Pear Body -->
    <path fill="#ffffff" filter="url(#glow)" d="M256,150 C215,150 195,190 185,225 C170,270 140,305 140,360 C140,430 190,470 256,470 C322,470 372,430 372,360 C372,305 342,270 327,225 C317,190 297,150 256,150 Z" />

    <!-- Sleek OLED Inner Curve Cutout for Premium Minimalist Effect -->
    <path fill="#000000" opacity="0.15" d="M270,165 C295,185 308,215 316,245 C328,285 352,315 352,360 C352,415 315,450 265,455 C315,448 340,412 340,360 C340,312 315,280 302,240 C294,210 282,185 270,165 Z" />
  </g>
</svg>
